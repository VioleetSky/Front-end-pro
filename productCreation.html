<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Створення товару</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
<main>
<h1 class="text-center">Створення товару</h1>
<hr>
<div class="col-4 d-flex justify-content-center">
    <form class="w-50" data-form>
        <div class="mb-3">
            <label for="nameProduct" class="form-label">Назва товару</label>
            <input type="text" name="name" class="form-control" id="nameProduct">
        </div>
        <div class="mb-3">
            <label for="productDescription" class="form-label">Опис товару</label>
            <textarea required name="description" class="form-control" id="productDescription"></textarea>
        </div>
        <div class="mb-3">
            <label for="productPrice" class="form-label">Ціна товару</label>
            <input type="number" name="price" class="form-control" id="productPrice">
        </div>

        <button type="submit" class="btn btn-primary">Надіслати</button>
    </form>
</div>
</main>
<script src="js/creation.js"></script>
<script src="js/ui.js"></script>
<script src="js/inventoryControl.js"></script>
</body>
</html>
